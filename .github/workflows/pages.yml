# Publishes the demo to GitHub Pages on every push to main. Nothing here costs
# anything on a public repository. Unlike the family's shared copy, this one retries the
# deploy (below); keep that when the copies are synced.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.again.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # The deploy sometimes fails on GitHub's side with nothing wrong here: it is tried once more, a minute later.
      - id: first
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.first.outcome == 'failure'
        run: sleep 60
      - id: again
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5
